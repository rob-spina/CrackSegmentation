name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Single place that decides how the test suite is launched.
# TODO: replace with your real test entry point if it is not unittest-based.
env:
  TEST_COMMAND: python -m unittest discover -v

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Headless OpenCV build: no libGL / display needed on the runner.
          # Tkinter and PyMuPDF are replaced by the doubles in tests_support/.
          pip install numpy opencv-python-headless scikit-image

      - name: Syntax check
        run: python -m compileall -q .

      - name: Run test suite
        run: ${{ env.TEST_COMMAND }}
