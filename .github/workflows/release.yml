name: Release builds

# Builds the standalone app on the three real OSes (PyInstaller cannot
# cross-compile) and attaches every installer to a GitHub Release.
# Triggered by pushing a version tag, e.g.:  git tag v1.0.2 && git push origin v1.0.2
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run test suite
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless scikit-image
          python -m unittest discover -v

  linux:
    needs: tests
    # 22.04 (glibc 2.35) so the binary also runs on older distros, not just the newest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages (Tkinter, venv, OpenCV runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv libgl1 libglib2.0-0
      - name: Build onedir + .deb
        run: |
          chmod +x packaging/build_linux.sh
          PYTHON_BIN=/usr/bin/python3 packaging/build_linux.sh
      - name: Package the raw executable folder
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -C packaging/dist -czf "CrackSegmentation-${VERSION:-dev}-linux-x86_64.tar.gz" CrackSegmentation
          cp packaging/dist/*.deb .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            CrackSegmentation-*-linux-x86_64.tar.gz
            *.deb
          if-no-files-found: error

  macos:
    needs: tests
    # Apple Silicon (arm64) runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build .app + .dmg
        run: |
          python -m venv .venv
          chmod +x packaging/build_mac.sh
          PYTHON_BIN="$PWD/.venv/bin/python" packaging/build_mac.sh
      - name: Rename the .dmg with the version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv packaging/dist/CrackSegmentation.dmg "CrackSegmentation-${VERSION:-dev}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: CrackSegmentation-*-macos-arm64.dmg
          if-no-files-found: error

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build .exe + Setup.exe
        shell: cmd
        run: |
          set PYTHON_BIN=python
          call packaging\build_windows.bat
          if not exist packaging\dist\CrackSegmentation-Setup.exe exit /b 1
      - name: Package portable zip + versioned installer
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          if (-not $version) { $version = "dev" }
          Compress-Archive -Path packaging\dist\CrackSegmentation -DestinationPath "CrackSegmentation-$version-windows-portable.zip"
          Copy-Item packaging\dist\CrackSegmentation-Setup.exe "CrackSegmentation-$version-windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            CrackSegmentation-*-windows-portable.zip
            CrackSegmentation-*-windows-Setup.exe
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub Release with all installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CrackSegmentation $GITHUB_REF_NAME" \
            --generate-notes
